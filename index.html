<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="A simple daily habit tracker.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="style.css">
<title>Daily Habit Tracker</title>
</head>
<body>
<main class="container">
<header>
  <div><p class="eyebrow">TODAY</p><h1>Build the habit.</h1></div>
  <div class="score"><strong id="percent">0%</strong><span id="summary">0 of 0 complete</span></div>
</header>

<button id="installButton" type="button" style="display:none;">
  📱 Install App
</button>
  
<div class="track"><div id="bar"></div></div>

<form id="form" class="add">
  <input id="input" maxlength="60" placeholder="Add a habit..." required>
  <button>+ Add Habit</button>
</form>

<section id="list"></section>
<div id="empty" class="empty">No habits yet. Add your first one above.</div>
<div id="message" class="message" aria-live="polite"></div>
<footer>Small steps. Repeated often.</footer>
</main>
<script src="app.js"></script>
</body>
</html>
